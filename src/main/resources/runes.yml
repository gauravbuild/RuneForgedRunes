# All shipped runes are editable. IDs are persistent: do not rename an ID on a live server.
# Add abilities with trigger, conditions (chance 0-100, cooldown seconds, is_sneaking,
# health_below_percent, target_type) and effects. Legacy rune effects remain available.
# Effects: HEAL:amount=2, FREEZE:ticks=60, VORTEX_PULL:radius=5,speed=0.5,
# BLEED:ticks=60,damage=1, PARTICLE:type=FLAME,count=10,
# PLAY_SOUND:sound=ENTITY_PLAYER_LEVELUP, COMMAND:console:say {player} forged a rune
# See effects-list.yml and partciles-list.yml in the plugin folder for supported entries.
# Purchase defaults: mode VAULT, price 100. Set purchase.mode to COMMANDS for a custom
# currency, with purchase.price equal to the cost, a numeric PlaceholderAPI
# purchase.balance-placeholder (e.g. '%credits_balance%') and purchase.commands
# such as ['credit take %player% %price%']. Use a fixed amount instead if
# preferred. Set mode DISABLED to hide purchases.
default-abilities-migrated: true
runes:
  VAMPIRE:
    display-name: '&dVampire Rune'
    category: COMBAT
    rarity: MYTHIC
    base-item: IRON_NUGGET
    custom-model-data: 1001
    glow: true
    lore: ['&7Chance to heal 2 HP on hit.', '', '&aSuccess: {success}% &8| &cDestroy: {destroy}%']
    target-items: [MELEE_WEAPON]
    default-success-rate: 5
    default-destroy-rate: 0
    purchase:
      mode: VAULT
      price: 100
      balance-placeholder: ''
